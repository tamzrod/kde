services:
  website:
    image: alpine:latest
    container_name: tamzrod-website
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - .:/usr/share/nginx/html:ro
    command: >
      sh -c "
        apk add --no-cache busybox-extras &&
        cd /usr/share/nginx/html &&
        busybox httpd -p 3456 -f
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3456/"]
      interval: 30s
      timeout: 3s
      retries: 3
