services:
  website:
    image: python:alpine
    container_name: tamzrod-website
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - .:/usr/share/nginx/html:ro
    working_dir: /usr/share/nginx/html
    command: python3 -m http.server 3456
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3456/"]
      interval: 30s
      timeout: 3s
      retries: 3
